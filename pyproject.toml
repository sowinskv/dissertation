[project]
name = "dissertation"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pyscf==2.14.0",
    "qiskit==2.5.2",
    "qiskit-nature==0.8.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning", "ignore::scipy.sparse.SparseEfficiencyWarning"]
